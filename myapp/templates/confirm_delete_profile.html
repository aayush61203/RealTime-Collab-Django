<!DOCTYPE html>
<html>
    <style>
        /* Base styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Header styles */
        h1 {
            text-align: center;
            color: #01070f;
            margin-top: 20px;
        }

        /* Confirmation message styles */
        p {
            color: #555;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Form styles */
        form {
            margin-top: 20px;
        }

        /* Submit button styles */
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #c82333; /* Darker shade on hover */
        }
    </style>
<head>
    <title>Confirm Delete</title>
</head>
<body>
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete profile for <b>{{ user_profile.username }}</b>?</p>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Delete">
    </form>
</body>
</html>
